[project]
name = "geo-research-agent"
version = "0.1.0"
description = "Deep research agentic AI for geospatial scientists — EO, remote sensing, climate, agriculture, and foundation models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GeoResearch Team" }]
keywords = ["geospatial", "earth-observation", "remote-sensing", "agentic-ai", "openai-agents"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "asyncio-throttle>=1.0.2",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "openai>=1.75.0",
    "openai-agents>=0.0.19",
    "pydantic>=2.10.0",
    "pyproj>=3.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "shapely>=2.0.0",
    "tenacity>=8.2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

# ── CLI entry points ──────────────────────────────────────────────────────────
[project.scripts]
geo-research = "main:main_sync"

# ── uv settings ───────────────────────────────────────────────────────────────
[tool.uv]
package = false          # not a library; skip building a wheel

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
